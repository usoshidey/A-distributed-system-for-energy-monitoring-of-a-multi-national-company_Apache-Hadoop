<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Distributed Energy Monitoring System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e3a8a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }
        .auth-card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
            width: 100%;
            max-width: 480px;
            overflow: hidden;
        }
        .auth-header {
            background-color: #0f172a;
            color: #ffffff;
            padding: 2rem;
            text-align: center;
        }
        .auth-body {
            padding: 2rem;
        }
        .quick-btn {
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="d-flex justify-content-center align-items-center gap-2 mb-2">
            <i class="bi bi-lightning-charge-fill text-warning fs-3"></i>
            <h4 class="m-0 fw-bold">Apex Global Energy</h4>
        </div>
        <p class="text-white-50 small m-0">Distributed Energy Monitoring System using Apache Hadoop</p>
    </div>

    <div class="auth-body">
        <ul class="nav nav-pills nav-justified mb-4" id="authTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active fw-bold" id="login-tab" data-bs-toggle="pill" data-bs-target="#tab-login" type="button">Sign In</button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold" id="register-tab" data-bs-toggle="pill" data-bs-target="#tab-register" type="button">Register</button>
            </li>
        </ul>

        <div class="tab-content" id="authTabContent">
            <!-- Sign In Tab -->
            <div class="tab-pane fade show active" id="tab-login" role="tabpanel">
                <form id="form-login">
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-person"></i></span>
                            <input type="text" class="form-control" id="login-username" required placeholder="admin or manager_in">
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="bi bi-lock"></i></span>
                            <input type="password" class="form-control" id="login-password" required placeholder="Enter password">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2 fw-bold mb-3">
                        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In to Dashboard
                    </button>
                </form>

                <hr class="my-3">
                <div class="text-muted small mb-2 fw-bold text-center">Quick Demonstration Access:</div>
                <div class="d-grid gap-1">
                    <button class="btn btn-outline-dark btn-sm quick-btn text-start" onclick="fillLogin('admin', 'Admin@123')">
                        <i class="bi bi-shield-check text-primary me-1"></i> Global CTO / Admin (admin / Admin@123)
                    </button>
                    <button class="btn btn-outline-secondary btn-sm quick-btn text-start" onclick="fillLogin('manager_in', 'Manager@123')">
                        <i class="bi bi-geo-alt text-danger me-1"></i> India Manager (manager_in / Manager@123)
                    </button>
                    <button class="btn btn-outline-secondary btn-sm quick-btn text-start" onclick="fillLogin('manager_us', 'Manager@123')">
                        <i class="bi bi-geo-alt text-primary me-1"></i> USA Manager (manager_us / Manager@123)
                    </button>
                </div>
            </div>

            <!-- Register Tab -->
            <div class="tab-pane fade" id="tab-register" role="tabpanel">
                <form id="form-register">
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Full Name</label>
                        <input type="text" class="form-control" id="reg-name" required placeholder="Dr. Jane Smith">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Username</label>
                        <input type="text" class="form-control" id="reg-username" required placeholder="jsmith">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Email Address</label>
                        <input type="email" class="form-control" id="reg-email" required placeholder="jane.smith@apexglobal.com">
                    </div>
                    <div class="mb-2">
                        <label class="form-label small fw-bold">Role</label>
                        <select class="form-select" id="reg-role" onchange="toggleCountrySelect()">
                            <option value="country_manager">Regional Country Manager</option>
                            <option value="admin">Global Administrator</option>
                        </select>
                    </div>
                    <div class="mb-2" id="div-assigned-country">
                        <label class="form-label small fw-bold">Assigned Country</label>
                        <select class="form-select" id="reg-country">
                            <option value="India">India</option>
                            <option value="USA">USA</option>
                            <option value="Germany">Germany</option>
                            <option value="Japan">Japan</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small fw-bold">Password</label>
                        <input type="password" class="form-control" id="reg-password" required placeholder="Create secure password">
                    </div>
                    <button type="submit" class="btn btn-success w-100 py-2 fw-bold">
                        <i class="bi bi-person-plus me-1"></i> Create Account
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script>
    function fillLogin(u, p) {
        document.getElementById("login-username").value = u;
        document.getElementById("login-password").value = p;
    }

    function toggleCountrySelect() {
        const role = document.getElementById("reg-role").value;
        document.getElementById("div-assigned-country").style.display = (role === "admin") ? "none" : "block";
    }

    document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;

        try {
            const res = await API.post("/auth/login", { username, password });
            if (res.success) {
                API.setCurrentUser(res.user);
                window.location.href = "dashboard.html";
            }
        } catch (err) {
            alert(err.message || "Invalid credentials.");
        }
    });

    document.getElementById("form-register").addEventListener("submit", async (e) => {
        e.preventDefault();
        const fullName = document.getElementById("reg-name").value.trim();
        const username = document.getElementById("reg-username").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const role = document.getElementById("reg-role").value;
        const assignedCountry = document.getElementById("reg-country").value;
        const password = document.getElementById("reg-password").value;

        try {
            const res = await API.post("/auth/register", {
                full_name: fullName,
                username,
                email,
                role,
                assigned_country: role === "country_manager" ? assignedCountry : null,
                password
            });
            if (res.success) {
                API.setCurrentUser(res.user);
                alert("Registration successful! Redirecting to dashboard...");
                window.location.href = "dashboard.html";
            }
        } catch (err) {
            alert(err.message || "Registration failed.");
        }
    });
</script>
</body>
</html>
